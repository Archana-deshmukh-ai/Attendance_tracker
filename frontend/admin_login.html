<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Attendance Atlas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-card h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .login-card .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .btn-primary {
            background: #667eea;
            border: none;
            width: 100%;
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background: #5a67d8;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .alert {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <i class="bi bi-shield-lock" style="font-size: 48px; color: #667eea;"></i>
            <h2>Admin Login</h2>
            <p class="subtitle">Access the Attendance Atlas Admin Panel</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('admin_login_submit') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="admin@attendance.com" value="admin@attendance.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••" value="admin@123">
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Login to Admin Panel
            </button>
        </form>
        
        <div class="mt-3 text-center">
            <small class="text-muted">
                <i class="bi bi-info-circle"></i> Default Admin: admin@attendance.com / admin@123
            </small>
        </div>
        
        <hr class="my-3">
        
        <div class="text-center">
            <a href="{{ url_for('home_page') }}" class="text-decoration-none">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
