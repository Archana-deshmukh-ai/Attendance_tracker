<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Attendance Atlas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        /* ===== NAVY BLUE THEME ===== */
        :root {
            --navy: #102094;
            --navy-dark: #0d1a7a;
            --navy-light: #e8ecf7;
        }

        body {
            background: linear-gradient(135deg, #102094 0%, #1a2bc3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 45px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            transition: transform 0.3s;
        }
        .login-card:hover {
            transform: translateY(-5px);
        }

        .login-card .text-center i {
            font-size: 52px;
            color: var(--navy);
            background: var(--navy-light);
            padding: 15px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .login-card h2 {
            color: var(--navy);
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .login-card .subtitle {
            color: #6b7280;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-label {
            color: #374151;
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s;
            background: #fafafa;
        }
        .form-control:focus {
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(16, 32, 148, 0.15);
            background: white;
        }

        .btn-primary {
            background: var(--navy);
            border: none;
            width: 100%;
            padding: 13px;
            font-weight: 600;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            margin-top: 5px;
        }
        .btn-primary:hover {
            background: var(--navy-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 32, 148, 0.35);
        }

        .btn-primary i {
            margin-right: 8px;
        }

        .alert {
            margin-top: 15px;
            border-radius: 10px;
            border: none;
            padding: 12px 16px;
        }
        .alert-danger {
            background: #fee2e2;
            color: #991b1b;
        }
        .alert-danger i {
            margin-right: 8px;
        }

        .text-muted {
            color: #6b7280 !important;
            font-size: 13px;
        }
        .text-muted i {
            color: var(--navy);
        }

        hr {
            border-color: #e5e7eb;
            margin: 20px 0;
        }

        .text-center a {
            color: var(--navy);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        .text-center a:hover {
            color: var(--navy-dark);
            text-decoration: underline;
        }
        .text-center a i {
            margin-right: 5px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 576px) {
            .login-card {
                padding: 30px 25px;
                margin: 15px;
            }
            .login-card h2 {
                font-size: 24px;
            }
            .login-card .text-center i {
                font-size: 40px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <i class="bi bi-shield-lock"></i>
            <h2>Admin Login</h2>
            <p class="subtitle">Access the Attendance Atlas Admin Panel</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('admin_login_submit') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" required placeholder="admin@attendance.com" value="admin@attendance.com">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••" value="admin@123">
            </div>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Login to Admin Panel
            </button>
        </form>
        
        <div class="mt-3 text-center">
            <small class="text-muted">
                <i class="bi bi-info-circle"></i> Default: <strong style="color: var(--navy);">admin@attendance.com</strong> / <strong style="color: var(--navy);">admin@123</strong>
            </small>
        </div>
        
        <hr>
        
        <div class="text-center">
            <a href="{{ url_for('home_page') }}">
                <i class="bi bi-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>
</body>
</html>
