<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attendance Reports</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/report.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">📊 Attendance Tracker</div>
    <nav>
        <a href="/">Home</a>
        <a href="/mark_attendance">Mark Attendance</a>
        <a href="/report" class="active">Reports</a>
        <a href="#">About Us</a>
        <a href="#" class="logout">Logout</a>
    </nav>
</header>

<!-- MAIN CONTENT -->
<main class="container">

    <h1>Attendance Reports</h1>

    <!-- TABLE -->
    <section class="table-section">
        <h2>Student Attendance Records</h2>

        <table id="reportTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Batch</th>
                    <th>Department</th>
                    <!-- <th>Date</th>
                    <th>Status</th> -->
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- CHARTS -->
    <section class="chart-section">
        <h2>Attendance Analytics</h2>

        <div class="charts">
            <div class="chart-box">
                <canvas id="statusChart"></canvas>
            </div>

            <div class="chart-box">
                <canvas id="trendChart"></canvas>
            </div>
        </div>
    </section>

</main>

<!-- JS -->
<script src="./report.js"></script>
</body>
</html>
