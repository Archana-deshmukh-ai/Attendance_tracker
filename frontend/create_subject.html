<!DOCTYPE html>
<html>
<head>
    <title>Create Subject - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-book-plus"></i> Create Subject</span>
            <a href="{{ url_for('subjects.index') }}" class="btn btn-outline-light btn-sm">Back to Subjects</a>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4><i class="bi bi-book-plus"></i> Add New Subject</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="code" class="form-label">Subject Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="code" name="code" required placeholder="e.g., CS101">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="name" class="form-label">Subject Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="e.g., Programming Fundamentals">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="credits" class="form-label">Credits <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="credits" name="credits" required placeholder="e.g., 3">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label">Department</label>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g., Computer Science">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label for="lecturer_id" class="form-label">Lecturer</label>
                            <select class="form-select" id="lecturer_id" name="lecturer_id">
                                <option value="">Select Lecturer</option>
                                {% for lecturer in lecturers %}
                                <option value="{{ lecturer.lecturer_id }}">{{ lecturer.name }} ({{ lecturer.lecturer_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-check-circle"></i> Create Subject
                        </button>
                        <a href="{{ url_for('subjects.index') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
