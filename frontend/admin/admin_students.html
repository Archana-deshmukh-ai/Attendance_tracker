<!DOCTYPE html>
<html>
<head>
    <title>Manage Students | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root {
            --navy: #102094;
            --navy-dark: #0d1a7a;
            --white: #ffffff;
            --gray: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--gray); }

        .sidebar {
            min-height: 100vh;
            background: var(--navy);
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            color: white;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar .brand {
            font-size: 22px;
            font-weight: 700;
            padding: 10px 0 25px 0;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            margin-bottom: 25px;
            color: white;
        }
        .sidebar .brand i { margin-right: 10px; }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.75);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.18);
            color: white;
            font-weight: 600;
        }
        .sidebar .nav-link i { margin-right: 12px; width: 22px; }

        .sidebar .logout-link {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.15);
            color: #ff6b6b;
        }
        .sidebar .logout-link:hover {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--navy);
        }
        .page-header h1 {
            color: var(--navy);
            font-size: 26px;
            font-weight: 700;
        }
        .page-header h1 i { margin-right: 12px; }

        .search-box {
            padding: 10px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            width: 300px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .search-box:focus {
            outline: none;
            border-color: var(--navy);
            box-shadow: 0 0 0 3px rgba(16,32,148,0.1);
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px;
            background: var(--navy);
            color: white;
            font-weight: 600;
        }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover { background: #f1f5f9; }

        .delete-btn {
            padding: 5px 14px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .no-data { text-align: center; padding: 40px; color: #6b7280; }
        .loading { text-align: center; padding: 40px; color: var(--navy); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 20px; }
            .page-header { flex-direction: column; text-align: center; gap: 15px; }
            .search-box { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            <i class="bi bi-shield-lock"></i> Admin Panel
        </div>
        <nav>
            <a class="nav-link" href="/admin">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a class="nav-link active" href="/admin/students">
                <i class="bi bi-people"></i> Students
            </a>
            <a class="nav-link" href="/admin/lecturers">
                <i class="bi bi-person-badge"></i> Lecturers
            </a>
            <a class="nav-link" href="/admin/subjects">
                <i class="bi bi-book"></i> Subjects
            </a>
            <a class="nav-link" href="/admin/attendance">
                <i class="bi bi-clipboard-data"></i> Attendance
            </a>
            <a class="nav-link logout-link" href="/admin-logout">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="page-header">
            <h1><i class="bi bi-people"></i> Manage Students</h1>
            <input class="search-box" id="searchInput" placeholder="🔍 Search by name or ID..." onkeyup="filterTable()">
        </div>

        <div class="table-container">
            <div id="loading" class="loading">Loading students...</div>
            <div id="tableContent" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Student ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Batch</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTableBody"></tbody>
                </table>
                <div id="noData" class="no-data" style="display: none;">No students found</div>
            </div>
        </div>
    </div>

    <script>
        let students = [];

        async function loadStudents() {
            try {
                const response = await fetch('/api/admin/students');
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableContent').style.display = 'block';
                
                if (data.success && data.students.length > 0) {
                    students = data.students;
                    renderTable(students);
                } else {
                    document.getElementById('noData').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '❌ Error loading students';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('studentsTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                document.getElementById('noData').style.display = 'block';
                return;
            }
            document.getElementById('noData').style.display = 'none';
            
            data.forEach((student, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td><strong style="color: var(--navy);">${student.student_id}</strong></td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.department || '-'}</td>
                    <td>${student.batch || '-'}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteStudent('${student.student_id}')">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = students.filter(s => 
                s.student_id.toLowerCase().includes(search) || 
                s.name.toLowerCase().includes(search)
            );
            renderTable(filtered);
        }

        async function deleteStudent(studentId) {
            if (confirm(`Are you sure you want to delete student ${studentId}?`)) {
                try {
                    const response = await fetch(`/api/admin/delete-student/${studentId}`, {
                        method: 'DELETE'
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        alert('Student deleted successfully!');
                        loadStudents();
                    } else {
                        alert('Error: ' + data.message);
                    }
                } catch (error) {
                    alert('Error deleting student');
                }
            }
        }

        loadStudents();
    </script>
</body>
</html>
