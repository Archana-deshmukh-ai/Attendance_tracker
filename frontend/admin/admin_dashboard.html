<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard | Attendance Atlas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        /* ===== NAVY BLUE THEME ===== */
        :root {
            --navy: #102094;
            --navy-dark: #0d1a7a;
            --navy-light: #e8ecf7;
            --white: #ffffff;
            --gray: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--gray); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            min-height: 100vh;
            background: var(--navy);
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            color: white;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar .brand {
            font-size: 22px;
            font-weight: 700;
            padding: 10px 0 25px 0;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            margin-bottom: 25px;
            color: white;
        }
        .sidebar .brand i { margin-right: 10px; }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.75);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.18);
            color: white;
            font-weight: 600;
        }
        .sidebar .nav-link i {
            margin-right: 12px;
            width: 22px;
            text-align: center;
        }

        .sidebar .logout-link {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.15);
            color: #ff6b6b;
        }
        .sidebar .logout-link:hover {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--navy);
        }
        .page-header h1 {
            color: var(--navy);
            font-size: 26px;
            font-weight: 700;
        }
        .page-header h1 i { margin-right: 12px; }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            text-align: center;
            transition: all 0.3s;
            border-bottom: 4px solid var(--navy);
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(16,32,148,0.12);
        }

        .stat-card .icon {
            font-size: 36px;
            margin-bottom: 10px;
        }
        .stat-card .icon.blue { color: var(--navy); }
        .stat-card .icon.green { color: #10b981; }
        .stat-card .icon.orange { color: #f59e0b; }
        .stat-card .icon.red { color: #ef4444; }

        .stat-card .number {
            font-size: 32px;
            font-weight: 700;
            color: var(--navy);
        }
        .stat-card .label {
            color: #6b7280;
            font-size: 14px;
            margin-top: 5px;
        }

        /* ===== QUICK ACTIONS ===== */
        .quick-actions {
            background: white;
            border-radius: 15px;
            padding: 25px 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }
        .quick-actions h5 {
            color: var(--navy);
            margin-bottom: 15px;
            font-weight: 600;
        }
        .quick-actions h5 i { margin-right: 10px; }

        .action-btn {
            padding: 10px 22px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16,32,148,0.2);
        }
        .action-btn.primary {
            background: var(--navy);
            color: white;
        }
        .action-btn.primary:hover { background: var(--navy-dark); }

        .action-btn.success {
            background: #10b981;
            color: white;
        }
        .action-btn.warning {
            background: #f59e0b;
            color: white;
        }
        .action-btn.danger {
            background: #ef4444;
            color: white;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar {
                width: 200px;
            }
            .main-content {
                margin-left: 200px;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                min-height: auto;
                position: relative;
                padding: 15px;
            }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 576px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .page-header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            <i class="bi bi-shield-lock"></i> Admin Panel
        </div>
        <nav>
            <a class="nav-link active" href="/admin">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a class="nav-link" href="/admin/students">
                <i class="bi bi-people"></i> Students
            </a>
            <a class="nav-link" href="/admin/lecturers">
                <i class="bi bi-person-badge"></i> Lecturers
            </a>
            <a class="nav-link" href="/admin/subjects">
                <i class="bi bi-book"></i> Subjects
            </a>
            <a class="nav-link" href="/admin/attendance">
                <i class="bi bi-clipboard-data"></i> Attendance
            </a>
            <a class="nav-link logout-link" href="/admin-logout">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="page-header">
            <h1><i class="bi bi-speedometer2"></i> Dashboard</h1>
            <span style="color: #6b7280;">
                <i class="bi bi-person-circle"></i> Welcome, Admin!
            </span>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon blue"><i class="bi bi-people"></i></div>
                <div class="number" id="studentCount">-</div>
                <div class="label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="icon green"><i class="bi bi-person-badge"></i></div>
                <div class="number" id="lecturerCount">-</div>
                <div class="label">Total Lecturers</div>
            </div>
            <div class="stat-card">
                <div class="icon orange"><i class="bi bi-book"></i></div>
                <div class="number" id="subjectCount">-</div>
                <div class="label">Total Subjects</div>
            </div>
            <div class="stat-card">
                <div class="icon red"><i class="bi bi-clipboard-data"></i></div>
                <div class="number" id="attendanceCount">-</div>
                <div class="label">Attendance Records</div>
            </div>
        </div>

        <!-- QUICK ACTIONS -->
        <div class="quick-actions">
            <h5><i class="bi bi-lightning"></i> Quick Actions</h5>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <a href="/admin/students" class="action-btn primary">
                    <i class="bi bi-people"></i> Manage Students
                </a>
                <a href="/admin/lecturers" class="action-btn success">
                    <i class="bi bi-person-badge"></i> Manage Lecturers
                </a>
                <a href="/admin/subjects" class="action-btn warning">
                    <i class="bi bi-book"></i> Manage Subjects
                </a>
                <a href="/admin/attendance" class="action-btn danger">
                    <i class="bi bi-clipboard-data"></i> View Attendance
                </a>
            </div>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('studentCount').textContent = data.stats.students;
                    document.getElementById('lecturerCount').textContent = data.stats.lecturers;
                    document.getElementById('subjectCount').textContent = data.stats.subjects;
                    document.getElementById('attendanceCount').textContent = data.stats.attendance_records;
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        loadStats();
    </script>
</body>
</html>
