<!DOCTYPE html>
<html>
<head>
    <title>Manage Subjects | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        :root {
            --navy: #102094;
            --navy-dark: #0d1a7a;
            --white: #ffffff;
            --gray: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--gray); }

        .sidebar {
            min-height: 100vh;
            background: var(--navy);
            padding: 20px;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            color: white;
            box-shadow: 2px 0 15px rgba(0,0,0,0.1);
        }

        .sidebar .brand {
            font-size: 22px;
            font-weight: 700;
            padding: 10px 0 25px 0;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            margin-bottom: 25px;
            color: white;
        }
        .sidebar .brand i { margin-right: 10px; }

        .sidebar .nav-link {
            color: rgba(255,255,255,0.75);
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 5px;
            transition: all 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .sidebar .nav-link:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.18);
            color: white;
            font-weight: 600;
        }
        .sidebar .nav-link i { margin-right: 12px; width: 22px; }

        .sidebar .logout-link {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid rgba(255,255,255,0.15);
            color: #ff6b6b;
        }
        .sidebar .logout-link:hover {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
        }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        .page-header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            border-left: 4px solid var(--navy);
        }
        .page-header h1 {
            color: var(--navy);
            font-size: 26px;
            font-weight: 700;
        }
        .page-header h1 i { margin-right: 12px; }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 12px;
            background: var(--navy);
            color: white;
            font-weight: 600;
        }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        tr:hover { background: #f1f5f9; }

        .badge-code {
            background: var(--navy-light);
            color: var(--navy);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .no-data { text-align: center; padding: 40px; color: #6b7280; }
        .loading { text-align: center; padding: 40px; color: var(--navy); }

        @media (max-width: 768px) {
            .sidebar { width: 100%; min-height: auto; position: relative; }
            .main-content { margin-left: 0; padding: 20px; }
        }
    </style>
</head>
<body>
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            <i class="bi bi-shield-lock"></i> Admin Panel
        </div>
        <nav>
            <a class="nav-link" href="/admin">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a class="nav-link" href="/admin/students">
                <i class="bi bi-people"></i> Students
            </a>
            <a class="nav-link" href="/admin/lecturers">
                <i class="bi bi-person-badge"></i> Lecturers
            </a>
            <a class="nav-link active" href="/admin/subjects">
                <i class="bi bi-book"></i> Subjects
            </a>
            <a class="nav-link" href="/admin/attendance">
                <i class="bi bi-clipboard-data"></i> Attendance
            </a>
            <a class="nav-link logout-link" href="/admin-logout">
                <i class="bi bi-box-arrow-right"></i> Logout
            </a>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="page-header">
            <h1><i class="bi bi-book"></i> Manage Subjects</h1>
        </div>

        <div class="table-container">
            <div id="loading" class="loading">Loading subjects...</div>
            <div id="tableContent" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>S.No</th>
                            <th>Subject ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Credits</th>
                            <th>Department</th>
                        </tr>
                    </thead>
                    <tbody id="subjectsTableBody"></tbody>
                </table>
                <div id="noData" class="no-data" style="display: none;">No subjects found</div>
            </div>
        </div>
    </div>

    <script>
        async function loadSubjects() {
            try {
                const response = await fetch('/api/admin/subjects');
                const data = await response.json();
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableContent').style.display = 'block';
                
                if (data.success && data.subjects.length > 0) {
                    const tbody = document.getElementById('subjectsTableBody');
                    tbody.innerHTML = '';
                    
                    data.subjects.forEach((subject, index) => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${index + 1}</td>
                            <td><strong style="color: var(--navy);">${subject.subject_id}</strong></td>
                            <td><span class="badge-code">${subject.code}</span></td>
                            <td>${subject.name}</td>
                            <td>${subject.credits || '-'}</td>
                            <td>${subject.department || '-'}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    document.getElementById('noData').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('loading').innerHTML = '❌ Error loading subjects';
            }
        }

        loadSubjects();
    </script>
</body>
</html>
